name: Upgrade 2.8

on:
  repository_dispatch:
    types:
      - geomapfish_2.8_updated

permissions:
  contents: read
  actions: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    name: Upgrade 2.8
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        branch:
          - prod-2-8
          - prod-2-8-advance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.branch }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ matrix.branch }}-${{ hashFiles('.pre-commit-config.yaml') }}
            pre-commit-${{ matrix.branch }}-

      - name: Update the demo
        run: >
          scripts/upgrade ${{ github.event.client_payload.version }}

      - name: Create the upgrade patch
        if: always()
        run: |
          touch /tmp/upgrade.patch
          sudo chown -R $(id -u) .
          ls -als .UPGRADE* || true
          git add --all || true
          git add --force .UPGRADE_INSTRUCTIONS upgrade .upgrade.yaml || true
          git status
          git diff --staged --patch > /tmp/upgrade.patch || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Interrupted upgrade to ${{ github.event.client_payload.version }} [${{ matrix.branch }}].patch
          path: /tmp/upgrade.patch
          retention-days: 1
        if: failure()

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Upgrade to ${{ github.event.client_payload.version }} [${{ matrix.branch }}].patch
          path: /tmp/upgrade.patch
          retention-days: 1
        if: success()
