name: Continuous integration

on:
  push:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  id-token: write
  packages: write

env:
  PROJECT: demo
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}
  # Requires CI_GPG_PRIVATE_KEY and GOPASS_CI_GITHUB_TOKEN secrets.
  OPENSHIFT_PROJECT: gs-gmf-demo
  # The release branches
  HELM_RELEASE_NAMES: prod-2-7
  SENTRY_PROJECT: geomapfish-demo
  SENTRY_ENVIRONMENT: prod-2-7
  DOCKER_BUILDKIT: '1'

jobs:
  main:
    name: Continuous integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - run: echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
      - run: python3 -m pip install --user --requirement=ci/requirements.txt

      - name: Checks
        run: c2cciutils-checks

      - run: touch env.secrets
      - run: sed -i '/^DOCKER_TAG=/d' env.project

      - name: Build
        run: ./build --docker-compose-version-2

      # `tag-publish` comes from the `.github/publish` uv project of the checked out branch,
      # with its dependencies fully locked, instead of an ad-hoc venv resolving unpinned
      # transitive dependencies.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          cache-python: true
          python-version: '3.14'
      - name: Publish
        run: >
          uv run --locked --isolated --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch || true
        if: failure()
      - uses: actions/upload-artifact@v4
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
      - name: Create Sentry release
        uses: getsentry/action-release@v1
        with:
          environment: ${{ env.SENTRY_ENVIRONMENT }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: camptocamp
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
        if: github.ref == 'refs/heads/prod-2-7'
