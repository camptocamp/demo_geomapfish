name: Continuous integration

on:
  push:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  id-token: write
  packages: write

env:
  PROJECT: demo
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}
  # SENTRY_PROJECT: geomapfish-demo
  # SENTRY_ENVIRONMENT: prod-2-8

jobs:
  main:
    name: Continuous integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: camptocamp/demo_geomapfish_data
          ref: master
          path: data

      - run: echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
      - run: python3 -m pip install --user --requirement=ci/requirements.txt

      - run: touch env.secrets

      - name: Checks
        run: c2cciutils-checks

      - name: Build
        run: ./build --docker-compose-version-2

      - name: Application checks
        run: make checks

      - name: Initialize the acceptance tests
        run: make acceptance-init
      - run: c2cciutils-docker-logs
        if: always()

      - name: Run the acceptance tests
        run: make acceptance
      - run: c2cciutils-docker-logs
        if: always()

      - run: make acceptance-dev
      - run: c2cciutils-docker-logs
        if: always()

      - run:
          docker compose --file=docker-compose.yaml --file=docker-compose-db.yaml --file=docker-compose.override.sample.yaml
          up -d
      - name: Run the acceptance tests on dev
        run: make acceptance
      - run: c2cciutils-docker-logs
        if: always()

      # Rebuild the image with the right schema
      - run: rm env.secrets
      - run: touch env.secrets
      - name: Build
        run: ./build --docker-compose-version-2 --no-pull

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: tag-publish-python
        with:
          python-version: '3.11'
          update-environment: false
      - run: ${{ steps.tag-publish-python.outputs.python-path }} -m venv ${HOME}/.tag-publish
      - run: ${HOME}/.tag-publish/bin/pip install tag-publish==1.2.6
      - run: echo "${HOME}/.tag-publish/bin" >> ${GITHUB_PATH}
      - name: Publish
        run: ${HOME}/.tag-publish/bin/tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Create Sentry release
      #   uses: getsentry/action-release@v1
      #   env:
      #     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      #     SENTRY_ORG: camptocamp
      #     SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
      #   with:
      #     environment: ${{ env.SENTRY_ENVIRONMENT }}
      #   if: github.ref == 'refs/heads/prod-2-8'
      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch || true
        if: failure()
      - uses: actions/upload-artifact@v4
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
