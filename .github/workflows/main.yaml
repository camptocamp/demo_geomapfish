name: Continuous integration

on:
  push:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  id-token: write
  packages: write

env:
  PROJECT: demo
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}
  # SENTRY_PROJECT: geomapfish-demo
  # SENTRY_ENVIRONMENT: prod-2-8

jobs:
  main:
    name: Continuous integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: camptocamp/demo_geomapfish_data
          ref: master
          path: data

      - run: echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
      - run: python3 -m pip install --user --requirement=ci/requirements.txt

      - run: touch env.secrets

      - name: Checks
        run: c2cciutils-checks

      - name: Build
        run: ./build --docker-compose-version-2

      - name: Application checks
        run: make checks

      - name: Initialize the acceptance tests
        run: make acceptance-init
      - run: c2cciutils-docker-logs
        if: always()

      - name: Run the acceptance tests
        run: make acceptance
      - run: c2cciutils-docker-logs
        if: always()

      - run: make acceptance-dev
      - run: c2cciutils-docker-logs
        if: always()

      - run:
          docker compose --file=docker-compose.yaml --file=docker-compose-db.yaml --file=docker-compose.override.sample.yaml
          up -d
      - name: Run the acceptance tests on dev
        run: make acceptance
      - run: c2cciutils-docker-logs
        if: always()

      # Rebuild the image with the right schema
      - run: rm env.secrets
      - run: touch env.secrets
      - name: Build
        run: ./build --docker-compose-version-2 --no-pull

      # `tag-publish` comes from the `.github/publish` uv project of the checked out branch, with
      # its dependencies fully locked, instead of the `ci/requirements.txt` of that branch.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          cache-python: true
          python-version: '3.14'

      - name: Publish
        run: uv run --locked --isolated --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
