name: Rebuild

on:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-26.04
    name: Rebuild
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: prod-2-8
            build_options: --docker-compose-version-2
          - branch: prod-2-9
            build_options: ''
          - branch: prod-2-10
            build_options: ''
          - branch: prod-2-11
            build_options: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python3 -m pip install --requirement=ci/requirements.txt
      - name: Environment information
        run: c2cciutils-env || true

      - run: touch env.secrets
      - run: sed -i '/^DOCKER_TAG=/d' env.project

      - name: Build
        run: ./build ${{ matrix.build_options }}

      # `tag-publish` comes from the `.github/publish` uv project of the checked out branch, with
      # its dependencies fully locked, instead of the `ci/requirements.txt` of that branch.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          cache-python: true
          python-version: '3.14'

      - name: Publish
        run: >
          uv run --locked --isolated --project=.github/publish
          tag-publish --type=rebuild --version=${{ matrix.branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
