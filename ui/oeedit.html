<!doctype html>
<html lang="{{mainCtrl.lang}}" ng-controller="OeeditController as mainCtrl" ng-strict-di>
  <head>
    <title data-i18n="Renovated Desktop Application">Renovated Desktop Application</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width" />
    <meta name="dynamicUrl" content="https://localhost:8484/dynamic.json" />
    <meta name="interface" content="oeedit" />
    <meta name="appName" content="Oeedit" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" referrerpolicy="no-referrer" />
  </head>
  <body ng-keydown="mainCtrl.onKeydown($event)">
    <div ng-show="mainCtrl.loading" class="loading-mask">
      <i class="fa-solid custom-spinner-loading fa-spin spinner-loading-mask"

            cx="256"
            cy="48"
            r="48"
            style="
              opacity: 1;
              fill-opacity: 1;
              stroke: #000;
              stroke-width: 0;
              stroke-miterlimit: 4;
              stroke-dasharray: none;
              stroke-opacity: 1;
            "
          />
          <circle
            cx="109.17"
            cy="108.313"
            r="43"
            style="
              opacity: 1;
              fill-opacity: 1;
              stroke: #000;
              stroke-width: 0;
              stroke-miterlimit: 4;
              stroke-dasharray: none;
              stroke-opacity: 1;
            "
          />
          <circle
            cx="46.537"
            cy="257.328"
            r="38"
            style="
              opacity: 1;
              fill-opacity: 1;
              stroke: #000;
              stroke-width: 0;
              stroke-miterlimit: 4;
              stroke-dasharray: none;
              stroke-opacity: 1;
            "
          />
          <circle
            cx="108.028"
            cy="403.972"
            r="33"
            style="
              opacity: 1;
              fill-opacity: 1;
              stroke: #000;
              stroke-width: 0;
              stroke-miterlimit: 4;
              stroke-dasharray: none;
              stroke-opacity: 1;
            "
          />
          <circle
            cx="255.794"
            cy="463.935"
            r="28"
            style="
              opacity: 1;
              fill-opacity: 1;
              stroke: #000;
              stroke-width: 0;
              stroke-miterlimit: 4;
              stroke-dasharray: none;
              stroke-opacity: 1;
            "
          />
          <circle
            cx="402.894"
            cy="402.936"
            r="23"
            style="
              opacity: 1;
              fill-opacity: 1;
              stroke: #000;
              stroke-width: 0;
              stroke-miterlimit: 4;
              stroke-dasharray: none;
              stroke-opacity: 1;
            "
          />
          <circle
            cx="463.623"
            cy="256.106"
            r="18"
            style="
              opacity: 1;
              fill-opacity: 1;
              stroke: #000;
              stroke-width: 0;
              stroke-miterlimit: 4;
              stroke-dasharray: none;
              stroke-opacity: 1;
            "
          /></svg
      ></i>
    </div>
    <gmf-desktop-canvas>
      <div slot="header" class="logo">
        <span></span>
      </div>
      <div slot="header" class="logo-right">
        <span></span>
      </div>

      <div slot="data" class="gmf-app-header">
        <div class="dropdown">
          <a href class="btn btn-block prime dropdown-toggle" data-toggle="dropdown">
            <span class="fa fa-grid"></span>
            <span ng-if="mainCtrl.gmfThemeManager.modeFlush">
              <span translate>Theme:</span>
              <b ng-if="mainCtrl.gmfThemeManager.isLoading()" translate>Loading...</b>
              <b ng-if="!mainCtrl.gmfThemeManager.isLoading()"
                >{{mainCtrl.gmfThemeManager.getThemeName() | translate}}</b
              >
            </span>
            <span ng-if="!mainCtrl.gmfThemeManager.modeFlush">
              <b ng-if="!mainCtrl.gmfThemeManager.themeName" translate>Themes</b>
            </span>
          </a>
          <gmf-themeselector
            class="dropdown-menu"
            gmf-themeselector-currenttheme="mainCtrl.theme"
            gmf-themeselector-filter="::mainCtrl.filter"
          >
          </gmf-themeselector>
        </div>
      </div>
      <div slot="data" class="gmf-app-content">
        <gmf-layertree gmf-layertree-dimensions="mainCtrl.dimensions" gmf-layertree-map="::mainCtrl.map">
        </gmf-layertree>
      </div>

      <!-- Selection -->
      <gmf-selection-button slot="tool-button"></gmf-selection-button>
      <div slot="tool-panel-selection" class="row">
        <div class="col-sm-12">
          <div class="gmf-app-tools-content-heading">{{'Selection' | translate}}</div>
          <ngeo-query-panel></ngeo-query-panel>
        </div>
      </div>

      <!-- Object Editing -->
      <gmf-oeedit-button slot="tool-button"></gmf-oeedit-button>
      <div slot="tool-panel-oeedit" class="row">
        <div class="col-sm-12">
          <div class="gmf-app-tools-content-heading">
            {{'Object Editing' | translate}}
            <a class="btn close" ng-click="mainCtrl.oeEditActive = false; mainCtrl.queryActive = true">&times;</a>
          </div>
          <gmf-objectediting
            ng-if="mainCtrl.oeFeature && mainCtrl.oeLayerNodeId"
            gmf-objectediting-active="mainCtrl.oeEditActive"
            gmf-objectediting-feature="mainCtrl.oeFeature"
            gmf-objectediting-geomtype="::mainCtrl.oeGeomType"
            gmf-objectediting-layernodeid="::mainCtrl.oeLayerNodeId"
            gmf-objectediting-map="::mainCtrl.map"
            gmf-objectediting-sketchfeatures="::mainCtrl.sketchFeatures">
          </gmf-objectediting>
        </div>
      </div>

      <gmf-search slot="map" gmf-search-map="::mainCtrl.map"></gmf-search>
      <ngeo-mapswipe
        slot="map"
        ng-if="mainCtrl.gmfLayerBeingSwipe.layer != null"
        map="::mainCtrl.map"
        layer="mainCtrl.gmfLayerBeingSwipe.layer"
        swipe-value="mainCtrl.gmfLayerBeingSwipe.swipeValue"
      >
      </ngeo-mapswipe>
      <div id="ol-zoom-control" slot="map"></div>
      <ngeo-displaywindow
        slot="map"
        content="mainCtrl.displaywindowContent"
        desktop="true"
        draggable-containment="mainCtrl.displaywindowDraggableContainment"
        height="mainCtrl.displaywindowHeight"
        open="mainCtrl.displaywindowOpen"
        title="mainCtrl.displaywindowTitle"
        url="mainCtrl.displaywindowUrl"
        width="mainCtrl.displaywindowWidth"
      ></ngeo-displaywindow>
      <button
        slot="map"
        ngeo-geolocation=""
        ngeo-geolocation-map="::mainCtrl.map"
        ngeo-geolocation-loading="mainCtrl.loading"
        ng-if="::mainCtrl.options.geolocalisation"
      >
        <span class="far fa-dot-circle"></span>
      </button>
      <div slot="map" class="gmf-app-map-bottom-controls">
        <div class="gmf-backgroundlayerbutton btn-group dropup">
          <button class="btn btn-default dropdown-toggle" data-toggle="dropdown">
            <img src="/background-layer-button.png" alt="" crossorigin="anonymous" />
          </button>
          <gmf-backgroundlayerselector gmf-backgroundlayerselector-map="::mainCtrl.map" class="dropdown-menu">
          </gmf-backgroundlayerselector>
        </div>
        <div class="gmf-app-map-messages">
          <gmf-disclaimer
            gmf-disclaimer-map="::mainCtrl.map"
            gmf-disclaimer-external-msg="disclaimerMsg"
            gmf-disclaimer-external-visibility="disclaimerVisibility"
          >
          </gmf-disclaimer>
        </div>
        <gmf-displayquerywindow
          ng-if="!mainCtrl.queryGrid"
          gmf-displayquerywindow-draggable-containment="::mainCtrl.displaywindowDraggableContainment"
          gmf-displayquerywindow-desktop="::true"
        >
        </gmf-displayquerywindow>
        <gmf-map-entrypoint></gmf-map-entrypoint>
      </div>
      <gmf-map
        slot="map"
        class="gmf-map"
        gmf-map-map="mainCtrl.map"
        gmf-map-manage-resize="mainCtrl.manageResize"
        gmf-map-resize-transition="mainCtrl.resizeTransition"
        gmf-contextualdata=""
        gmf-contextualdata-displayed="mainCtrl.contextdataActive"
        gmf-contextualdata-map="::mainCtrl.map"
      >
      </gmf-map>
      <ngeo-query
        slot="map"
        active="mainCtrl.queryActive"
        autoclear="mainCtrl.queryAutoClear"
        map="::mainCtrl.map"
      >
      </ngeo-query>
      <div
        slot="infobar-left"
        ngeo-scaleselector
        ngeo-scaleselector-map="mainCtrl.map"
        class="gmf-app-footer-div"
      ></div>
      <div slot="infobar-left" id="scaleline" class="gmf-app-footer-div"></div>
      <gmf-elevationwidget
        slot="infobar-right"
        gmf-elevationwidget-map="::mainCtrl.map"
        gmf-elevationwidget-active="::mainCtrl.options.showInfobar"
      >
      </gmf-elevationwidget>
      <gmf-mouseposition
        slot="infobar-right"
        gmf-mouseposition-map="mainCtrl.map"
        class="text-center gmf-app-footer-div"
      >
      </gmf-mouseposition>
      </ngeo-modal>
      <gmf-displayquerygrid
        slot="footer-queryresult"
        gmf-displayquerygrid-active="mainCtrl.queryGridActive"
        gmf-displayquerygrid-map="::mainCtrl.map"
        ngeo-resizemap="mainCtrl.map"
        ngeo-resizemap-state="mainCtrl.queryGridActive"
      >
      </gmf-displayquerygrid>
    </gmf-desktop-canvas>
    <script nomodule>
      alert(
        'Your browser is not supported, please use a recent version of Firefox, Chrome or Edge.\n\n' +
          "Votre navigateur n'est pas supporté, veuillez utiliser une version récente de Firefox, Chrome or Edge.\n\n" +
          'Ihr Browser wird nicht unterstützt, bitte verwenden Sie eine aktuelle Version von Firefox, Chrome oder Edge.',
      );
    </script>

      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
    ></script>
  </body>
</html>
