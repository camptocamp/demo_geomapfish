inherits:
  - duplicated
  - utils:no-design-checks

max-line-length: 110
pylint:
  options:
    max-line-length: 110
  disable:
    - too-many-locals
    - too-many-statements
    - too-many-branches
    - c-extension-no-member

bandit:
  run: true
pyflakes:
  disable:
    - F401

pycodestyle:
  options:
    max-line-length: 110
  disable:
    - E203

mccabe:
  run: false
