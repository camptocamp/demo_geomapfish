[project]
name = 'custom'
version = '0.0.0'
description = 'Custom package for GeoMapFish demo'
authors = []

[project.scripts]
custom-initialize-db = "custom.scripts.initialize_db:main"

[project.entry-points."paste.app_factory"]
main = "custom:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
gunicorn = "25.1.0"
plaster-pastedeploy = "1.0.1"
pyramid = "2.0.2"
pyramid-mako = "1.1.0"
pyramid-debugtoolbar = "4.12.1"
waitress = "3.0.2"
alembic = "1.18.4"
pyramid-retry = "2.1.1"
pyramid-tm = "2.6"
sqlalchemy = "2.0.46"
transaction = "5.0"
"zope.sqlalchemy" = "4.1"
cornice = "6.1.0"
requests = "2.33.0"
psycopg2 = "2.9.11"
c2cwsgiutils = { version = "6.1.9", extras = ["webserver"] }
cee-syslog-handler = "0.6.0"
PyJWT = "2.12.0"
redis = "7.2.0"
PyYAML = "6.0.3"
sentry-sdk = "2.53.0"
requests-oauthlib = "2.0.0"
ujson = "5.12.0"
azure-storage-blob = "12.28.0"
azure-identity = "1.25.2"
papyrus = "2.6.2"
geojson = "3.2.0"
# To fix CVE
urllib3 = "2.6.3"
certifi = { version = "2026.2.25", optional = true }
webob = { version = "1.8.9", optional = true }
cryptography = "46.0.5"
azure-core = "1.38.2"
setuptools = "80.10.2"

[tool.poetry.group.dev.dependencies]
prospector = { version = "1.18.0", extras = ["with_bandit", "with_mypy", "with_pyroma", "with_ruff"] }
prospector-profile-utils = "1.27.0"
prospector-profile-duplicated = "1.12.0"
types-requests = "2.32.4.20260107"
types-oauthlib = "3.3.0.20250822"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
