[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = "0.141.1"
uvicorn = { version = "0.53.0", extras = ["standard"] }
c2casgiutils = { version = "0.14.0", extras = ["alembic", "sqlalchemy"] }
pydantic-settings = "2.15.0"
jinja2 = "3.1.6"
sqlalchemy = "2.0.54"
alembic = "1.20.0"
requests = "2.34.2"
psycopg2 = "2.9.13"
PyJWT = "2.15.0"
redis = "8.1.0"
PyYAML = "6.0.3"
requests-oauthlib = "2.0.0"
ujson = "6.0.0"
azure-storage-blob = "12.30.3"
azure-identity = "1.25.3"
geojson = "3.3.0"
urllib3 = "2.8.0"
cryptography = "50.0.2"
azure-core = "1.41.0"
idna = "3.20"
oauthlib = "4.0.0"
mako = "1.4.2"
multidict = "6.9.1"

[tool.poetry.group.dev.dependencies]
prospector = { version = "1.19.1", extras = ["with_bandit", "with_mypy", "with_pyroma", "with_ruff"] }
prospector-profile-utils = "1.27.0"
prospector-profile-duplicated = "1.12.0"
types-requests = "2.33.0.20260906"
types-oauthlib = "3.3.0.20260724"
ruff = "0.16.9"
pylint = "4.0.9"
httpx = "0.28.1"
pytest-asyncio = "1.4.0"

[project]
name = 'custom'
version = '0.0.0'
description = 'Custom package for GeoMapFish demo'
authors = []
requires-python = ">=3.14"

[project.scripts]
custom-initialize-db = "custom.scripts.initialize_db:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
