[tool.poetry]
name = 'demo-geomapfish-custom'
version = '0.0.0'
description = 'Not used'
authors = []

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
gunicorn = "23.0.0"
plaster-pastedeploy = "1.0.1"
pyramid = "2.0.2"
pyramid-mako = "1.1.0"
pyramid-debugtoolbar = "4.12.1"
waitress = "3.0.2"
alembic = "1.17.2"
pyramid-retry = "2.1.1"
pyramid-tm = "2.6"
sqlalchemy = "2.0.45"
transaction = "5.0"
"zope.sqlalchemy" = "4.1"
cornice = "6.1.0"
requests = "2.32.5"
psycopg2 = "2.9.11"
c2cwsgiutils = { version = "6.1.9", extras = ["webserver"] }
cee-syslog-handler = "0.6.0"
PyJWT = "2.10.1"
redis = "7.1.0"
PyYAML = "6.0.3"
sentry-sdk = "2.48.0"
requests-oauthlib = "2.0.0"
ujson = "5.11.0"
azure-storage-blob = "12.27.1"
