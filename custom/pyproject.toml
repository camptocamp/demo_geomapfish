[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "0.140.13"
uvicorn = { version = "0.38.0", extras = ["standard"] }
c2casgiutils = { version = "0.13.4", extras = ["alembic", "sqlalchemy"] }
pydantic-settings = "2.10.1"
jinja2 = "3.1.6"
sqlalchemy = "2.0.51"
alembic = "1.18.5"
requests = "2.34.2"
psycopg2 = "2.9.12"
PyJWT = "2.13.0"
redis = "8.0.1"
PyYAML = "6.0.3"
requests-oauthlib = "2.0.0"
ujson = "5.13.0"
azure-storage-blob = "12.30.0"
azure-identity = "1.25.3"
geojson = "3.3.0"
urllib3 = "2.7.0"
cryptography = "50.0.0"
azure-core = "1.41.0"
idna = "3.18"

[tool.poetry.group.dev.dependencies]
prospector = { version = "1.19.1", extras = ["with_bandit", "with_mypy", "with_pyroma", "with_ruff"] }
prospector-profile-utils = "1.27.0"
prospector-profile-duplicated = "1.12.0"
types-requests = "2.33.0.20260712"
types-oauthlib = "3.3.0.20260724"
ruff = "0.15.20"
pylint = "4.0.6"
httpx = "0.28.1"
pytest-asyncio = "1.3.0"

[project]
name = 'custom'
version = '0.0.0'
description = 'Custom package for GeoMapFish demo'
authors = []

[project.scripts]
custom-initialize-db = "custom.scripts.initialize_db:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
