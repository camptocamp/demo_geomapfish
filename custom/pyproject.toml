urllib3 = "2.6.3"
certifi = { version = "2026.1.4", optional = true }
webob = { version = "1.8.9", optional = true }
cryptography = { version = "46.0.3", optional = true }

[tool.poetry.group.dev.dependencies]
prospector = { version = "1.17.3", extras = ["with_bandit", "with_mypy", "with_pyroma", "with_ruff"] }
prospector-profile-utils = "1.26.5"
