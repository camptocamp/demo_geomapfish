# https://pre-commit.com/hooks.html

exclude: |-
  (?x)^(
    CONST_.*
    |mapserver/data/lac-leman.osm
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: |-
          (?x)^(
            ui/package\.json
          )$
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=.md
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: |-
          (?x)^(
            ui/tsconfig\.json
          )$
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        exclude: |-
          (?x)^(
            geoportal/geomapfish_geoportal/static-ngeo/js/apps/Controller.*\.js
            |geoportal/webpack\.apps\.js
            |ui/package\.json
          )$
  - repo: https://github.com/sbrunner/integrity-updater
    rev: 1.0.2
    hooks:
      - id: integrity-updater
        files: |-
          (?x)^(
            geoportal/geomapfish_geoportal/static/.*
            |ui/.*
          )$
        args:
          - --pre-commit
          - --blacklist=https://maps\.googleapis\.com/
  - repo: https://github.com/sbrunner/hooks
    rev: 1.6.1
    hooks:
      - id: copyright
        exclude: |-
          (?x)^(
            build
            |geoportal
            |scripts/db-backup
            |scripts/db-restore
          )$
      - id: poetry-lock
        additional_dependencies:
          - poetry==2.1.4 # pypi
        exclude: |-
          (?x)^(
            pyproject\.toml
          )$
      - id: npm-lock
      - id: canonicalize
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: |-
          (?x)^(
            (.*/)?poetry\.lock
            |(.*/)?package-lock\.json
            |ci/cleanup
            |geoportal/geomapfish_geoportal/locale/.*
            |qgisserver/.*\.qg[sz]
            |geoportal/geomapfish_geoportal/static/story-map\.html
            |tilegeneration/config\.yaml\.tmpl
            |webcomponents/feedback\.ts
            |ui/src/webcomponents/feedback\.ts
          )$
        args:
          - --ignore-words=.github/spell-ignore-words.txt
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: git-check
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.3
    hooks:
      - id: check-github-actions
      - id: check-github-workflows
      - id: check-jsonschema
        name: Check GitHub Workflows set timeout-minutes
        files: ^\.github/workflows/[^/]+$
        types:
          - yaml
        args:
          - --builtin-schema
          - github-workflows-require-timeout
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
  - repo: https://github.com/sbrunner/jsonschema-validator
    rev: 1.0.0
    hooks:
      - id: jsonschema-validator
        files: |-
          (?x)^(
            \.github/publish\.yaml
            |\.github/ghci\.yaml
            |CONST_create_template/ci/config\.yaml
            |ci/config\.yaml
          )$
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 41.83.1
    hooks:
      - id: renovate-config-validator
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff-format
  - repo: https://github.com/sbrunner/python-versions-hook
    rev: 1.1.2
    hooks:
      - id: python-versions
